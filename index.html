<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>SpaceshipRGL</title>
    <style>
      html, body {
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
        overflow: hidden;
        background: #231F20;
      }

      #unity-canvas {
        position: fixed;
        inset: 0;
        display: block;
        width: 100vw;
        height: 100vh;
        border: 0;
        background: #231F20;
        touch-action: none;
      }
    </style>
  </head>
  <body>
    <canvas id="unity-canvas" width=960 height=600 tabindex="-1"></canvas>
    <script src="Build/SpaceShipRGL-Build.loader.js"></script>
    <script>
      const canvas = document.querySelector("#unity-canvas");
      const config = {
        arguments: [],
        dataUrl: "Build/SpaceShipRGL-Build.data",
        frameworkUrl: "Build/SpaceShipRGL-Build.framework.js",
        codeUrl: "Build/SpaceShipRGL-Build.wasm",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "DefaultCompany",
        productName: "SpaceshipRGL",
        productVersion: "1.0",
      };

      createUnityInstance(canvas, config).then((unityInstance) => {
        canvas.focus();
      }).catch((message) => {
        alert(message);
      });
    </script>
  </body>
</html>
